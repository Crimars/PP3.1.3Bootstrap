<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"  rel="stylesheet">
  <style>
    /* Стили для бокового меню */
    .sidebar {
      position: fixed;
      top: 60px;
      bottom: 0;
      left: 0;
      width: 250px;
      padding: 20px;
      background-color: #f8f9fa;
      overflow-y: auto;
    }
    .content {
      margin-left: 250px; /* Отступ для бокового меню */
      padding: 40px 20px;
    }
    .nav-link.active {
      background-color: #0d6efd !important;
      color: white !important;
    }
    .logout-btn {
      float: right;
      margin-top: 10px;
    }
    .user-info {
      background-color: #f8f9fa;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    .nav-tabs {
      margin-bottom: 20px;
    }
    .table-container {
      background-color: white;
      border-radius: 5px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .user-details {
      margin-bottom: 20px;
    }
    .user-details div {
      margin-bottom: 10px;
    }
    /* Стили для таблицы */
    .table-responsive {
      height: calc(100vh - 160px); /* Высота экрана минус высота заголовка и отступов */
      overflow-y: auto;
    }
  </style>
</head>
<body class="bg-light">

<!-- Заголовок -->
<nav class="navbar navbar-dark bg-dark sticky-top">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">Admin Panel</span>
    <span class="navbar-text me-auto" sec:authentication="name"></span>
    <form class="logout-btn" th:action="@{/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="btn btn-danger">Logout</button>
    </form>
  </div>
</nav>

<div class="d-flex">
  <!-- Боковое меню -->
  <div class="sidebar">
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link active" th:href="@{/admin}">Admin</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:href="@{/user}">User</a>
      </li>
    </ul>
  </div>

  <!-- Основной контент -->
  <div class="content">
    <!-- User Info -->
    <div class="user-info">
      <span sec:authentication="name"></span> with roles:
      <span sec:authentication="principal.authorities"></span>
    </div>

    <!-- Tabs -->
    <ul class="nav nav-tabs">
      <li class="nav-item">
        <a class="nav-link active" href="#">Users table</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:href="@{/admin/new}">New User</a>
      </li>
    </ul>

    <!-- Table Section -->
    <div class="table-container">
      <h3 class="mb-3">All users</h3>
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Age</th>
            <th>Email</th>
            <th>Role</th>
            <th>Edit</th>
            <th>Delete</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.firstName}"></td>
            <td th:text="${user.lastName}"></td>
            <td th:text="${user.age}"></td>
            <td th:text="${user.email}"></td>
            <td>
              <span th:each="role, iterStat : ${user.roles}"
                    th:text="${role.name} + (${not iterStat.last} ? ' ' : '')"></span>
            </td>
            <td>
              <!-- Edit Button -->
              <button type="button" class="btn btn-sm btn-outline-primary me-2"
                      data-bs-toggle="modal"
                      data-bs-target="#editModal"
                      th:attr="data-bs-userid=${user.id},
                                data-bs-firstname=${user.firstName},
                                data-bs-lastname=${user.lastName},
                                data-bs-age=${user.age},
                                data-bs-email=${user.email},
                                data-bs-roles=${#strings.listJoin(user.roles.![name], ' ')}">
                Edit
              </button>
            </td>
            <td>
              <!-- Delete Button -->
              <button type="button" class="btn btn-sm btn-outline-danger"
                      data-bs-toggle="modal"
                      data-bs-target="#deleteModal"
                      th:attr="data-bs-userid=${user.id},
                                data-bs-firstname=${user.firstName},
                                data-bs-lastname=${user.lastName},
                                data-bs-age=${user.age},
                                data-bs-email=${user.email},
                                data-bs-roles=${#strings.listJoin(user.roles.![name], ' ')}">
                Delete
              </button>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editModalLabel">Edit User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="editForm" th:action="@{/admin/update}" method="post">
          <input type="hidden" id="editUserId" name="id">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <div class="mb-3">
            <label for="editFirstName" class="form-label">First Name</label>
            <input type="text" class="form-control" id="editFirstName" name="firstName" required>
          </div>
          <div class="mb-3">
            <label for="editLastName" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="editLastName" name="lastName" required>
          </div>
          <div class="mb-3">
            <label for="editAge" class="form-label">Age</label>
            <input type="number" class="form-control" id="editAge" name="age" min="1" max="150" required>
          </div>
          <div class="mb-3">
            <label for="editEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="editEmail" name="email" required>
          </div>
          <div class="mb-3">
            <label for="editRoles" class="form-label">Role</label>
            <select class="form-select" id="editRoles" name="roles">
              <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"></option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="submit" form="editForm" class="btn btn-primary">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteModalLabel">Delete user</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="user-details">
          <div><strong>ID:</strong> <span id="deleteUserId"></span></div>
          <div><strong>First name:</strong> <span id="deleteUserFirstName"></span></div>
          <div><strong>Last name:</strong> <span id="deleteUserLastName"></span></div>
          <div><strong>Age:</strong> <span id="deleteUserAge"></span></div>
          <div><strong>Email:</strong> <span id="deleteUserEmail"></span></div>
          <div><strong>Role:</strong> <span id="deleteUserRoles"></span></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <form id="deleteForm" method="post">
          <input type="hidden" name="_method" value="delete">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button type="submit" class="btn btn-danger">Delete</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Populate Edit Modal
  document.getElementById('editModal').addEventListener('show.bs.modal', function (event) {
    const button = event.relatedTarget;
    const userId = button.getAttribute('data-bs-userid');
    const firstName = button.getAttribute('data-bs-firstname');
    const lastName = button.getAttribute('data-bs-lastname');
    const age = button.getAttribute('data-bs-age');
    const email = button.getAttribute('data-bs-email');
    const roles = button.getAttribute('data-bs-roles');
    document.getElementById('editUserId').value = userId;
    document.getElementById('editFirstName').value = firstName;
    document.getElementById('editLastName').value = lastName;
    document.getElementById('editAge').value = age;
    document.getElementById('editEmail').value = email;

    // Set the selected role in the dropdown
    const rolesArray = roles.split(' ');
    const roleSelect = document.getElementById('editRoles');
    Array.from(roleSelect.options).forEach(option => {
      option.selected = rolesArray.includes(option.text);
    });
  });

  // Handle Edit Form Submission
  document.getElementById('editForm').addEventListener('submit', function (event) {
    event.preventDefault();
    const formData = new FormData(this);
    fetch(this.action, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: new URLSearchParams(formData),
    })
            .then(response => {
              if (response.ok) {
                const modal = bootstrap.Modal.getInstance(document.getElementById('editModal'));
                modal.hide();
                window.location.reload(); // Reload the page after successful update
              } else {
                console.error('Error:', response.statusText);
              }
            })
            .catch(error => console.error('Error:', error));
  });

  // Populate Delete Modal
  document.getElementById('deleteModal').addEventListener('show.bs.modal', function (event) {
    const button = event.relatedTarget;
    const userId = button.getAttribute('data-bs-userid');
    const firstName = button.getAttribute('data-bs-firstname');
    const lastName = button.getAttribute('data-bs-lastname');
    const age = button.getAttribute('data-bs-age');
    const email = button.getAttribute('data-bs-email');
    const roles = button.getAttribute('data-bs-roles');
    document.getElementById('deleteUserId').textContent = userId;
    document.getElementById('deleteUserFirstName').textContent = firstName;
    document.getElementById('deleteUserLastName').textContent = lastName;
    document.getElementById('deleteUserAge').textContent = age;
    document.getElementById('deleteUserEmail').textContent = email;
    document.getElementById('deleteUserRoles').textContent = roles;
    document.getElementById('deleteForm').action = '/admin/users/' + userId;
  });

  // Handle Delete Form Submission
  document.getElementById('deleteForm').addEventListener('submit', function (event) {
    event.preventDefault();
    fetch(this.action, {
      method: 'DELETE',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: new URLSearchParams(new FormData(this)),
    })
            .then(response => {
              if (response.ok) {
                const modal = bootstrap.Modal.getInstance(document.getElementById('deleteModal'));
                modal.hide();
                window.location.reload(); // Reload the page after successful deletion
              } else {
                console.error('Error:', response.statusText);
              }
            })
            .catch(error => console.error('Error:', error));
  });
</script>
</body>
</html>
