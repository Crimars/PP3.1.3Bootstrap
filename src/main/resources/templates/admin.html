<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .user-info {
      background-color: #f8f9fa;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    .nav-tabs {
      margin-bottom: 20px;
    }
    .table-container {
      background-color: white;
      border-radius: 5px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .user-details {
      margin-bottom: 20px;
    }
    .user-details div {
      margin-bottom: 10px;
    }
  </style>
</head>
<body class="bg-light">
<div class="container py-4">
  <!-- User Info -->
  <div class="user-info">
    <span sec:authentication="name"></span> with roles:
    <span sec:authentication="principal.authorities"></span>
  </div>

  <!-- Header -->
  <h1 class="mb-4">Admin Panel</h1>

  <!-- Tabs -->
  <ul class="nav nav-tabs">
    <li class="nav-item">
      <a class="nav-link active" href="#">Users table</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:href="@{/admin/new}">New User</a>
    </li>
  </ul>

  <!-- Table Section -->
  <div class="table-container">
    <h3 class="mb-3">All users</h3>

    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Age</th>
          <th>Email</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
          <td th:text="${user.id}"></td>
          <td th:text="${user.firstName}"></td>
          <td th:text="${user.lastName}"></td>
          <td th:text="${user.age}"></td>
          <td th:text="${user.email}"></td>
          <td>
                                <span th:each="role,iterStat : ${user.roles}"
                                      th:text="${role.name} + (${not iterStat.last} ? ' ' : '')"></span>
          </td>
          <td>
            <a th:href="@{/admin/edit/{id}(id=${user.id})}"
               class="btn btn-sm btn-outline-primary me-2">Edit</a>


            <button type="button" class="btn btn-sm btn-outline-danger"
                    data-bs-toggle="modal"
                    data-bs-target="#deleteModal"
                    th:attr="data-bs-userid=${user.id},
                                                data-bs-firstname=${user.firstName},
                                                data-bs-lastname=${user.lastName},
                                                data-bs-age=${user.age},
                                                data-bs-email=${user.email},
                                                data-bs-roles=${#strings.listJoin(user.roles.![name], ' ')}">
              Delete
            </button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>


<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteModalLabel">Delete user</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="user-details">
          <div><strong>ID:</strong> <span id="deleteUserId"></span></div>
          <div><strong>First name:</strong> <span id="deleteUserFirstName"></span></div>
          <div><strong>Last name:</strong> <span id="deleteUserLastName"></span></div>
          <div><strong>Age:</strong> <span id="deleteUserAge"></span></div>
          <div><strong>Email:</strong> <span id="deleteUserEmail"></span></div>
          <div><strong>Role:</strong> <span id="deleteUserRoles"></span></div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <form id="deleteForm" method="post">
          <input type="hidden" name="_method" value="delete">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button type="submit" class="btn btn-danger">Delete</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

  document.getElementById('deleteModal').addEventListener('show.bs.modal', function (event) {
    const button = event.relatedTarget;
    const userId = button.getAttribute('data-bs-userid');
    const firstName = button.getAttribute('data-bs-firstname');
    const lastName = button.getAttribute('data-bs-lastname');
    const age = button.getAttribute('data-bs-age');
    const email = button.getAttribute('data-bs-email');
    const roles = button.getAttribute('data-bs-roles');


    document.getElementById('deleteUserId').textContent = userId;
    document.getElementById('deleteUserFirstName').textContent = firstName;
    document.getElementById('deleteUserLastName').textContent = lastName;
    document.getElementById('deleteUserAge').textContent = age;
    document.getElementById('deleteUserEmail').textContent = email;
    document.getElementById('deleteUserRoles').textContent = roles;


    document.getElementById('deleteForm').action = '/admin/users/' + userId;
  });


    document.addEventListener('DOMContentLoaded', function() {
    const deleteForm = document.getElementById('deleteForm');

    deleteForm.addEventListener('submit', function(e) {
    e.preventDefault();

    fetch(deleteForm.action, {
    method: 'POST',
    headers: {
    'Content-Type': 'application/x-www-form-urlencoded',
  },
    body: new URLSearchParams(new FormData(deleteForm))
  })
    .then(response => {
    if (response.ok) {

      const modal = bootstrap.Modal.getInstance(document.getElementById('deleteModal'));
      modal.hide();

      window.location.reload();
    }
  })
    .catch(error => console.error('Error:', error));
  });
  });

    </script>
</body>
</html>
