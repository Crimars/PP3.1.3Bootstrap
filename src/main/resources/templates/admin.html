<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .user-info {
      background-color: #f8f9fa;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    .nav-tabs {
      margin-bottom: 20px;
    }
    .table-container {
      background-color: white;
      border-radius: 5px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body class="bg-light">
<div class="container py-4">
  <!-- User Info -->
  <div class="user-info">
    <span sec:authentication="name"></span> with roles:
    <span sec:authentication="principal.authorities"></span>
  </div>

  <!-- Header -->
  <h1 class="mb-4">Admin Panel</h1>

  <!-- Tabs -->
  <ul class="nav nav-tabs">
    <li class="nav-item">
      <a class="nav-link active" href="#">Users table</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:href="@{/admin/new}">New User</a>
    </li>
  </ul>

  <!-- Table Section -->
  <div class="table-container">
    <h3 class="mb-3">All users</h3>

    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Age</th>
          <th>Email</th>
          <th>Role</th>
          <th>Edit</th>
          <th>Delete</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
          <td th:text="${user.id}"></td>
          <td th:text="${user.firstName}"></td>
          <td th:text="${user.lastName}"></td>
          <td th:text="${user.age}"></td>
          <td th:text="${user.email}"></td>
          <td>
                                <span th:each="role,iterStat : ${user.roles}"
                                      th:text="${role.name} + (${not iterStat.last} ? ' ' : '')"></span>
          </td>
          <td>
            <a th:href="@{/admin/edit/{id}(id=${user.id})}"
               class="btn btn-sm btn-outline-primary">Edit</a>
          </td>
          <td>
            <form th:action="@{/admin/delete/{id}(id=${user.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button type="submit" class="btn btn-sm btn-outline-danger"
                      onclick="return confirm('Are you sure you want to delete this user?')">
                Delete
              </button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
