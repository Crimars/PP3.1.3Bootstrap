<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add new user</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .user-info {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .nav-tabs {
            margin-bottom: 20px;
        }
        .form-container {
            background-color: white;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-4">
    <!-- User Info -->
    <div class="user-info">
        <span sec:authentication="name"></span> with roles:
        <span sec:authentication="principal.authorities"></span>
    </div>

    <!-- Header -->
    <h1 class="mb-4">Admin Panel</h1>

    <!-- Tabs -->
    <ul class="nav nav-tabs">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin}">Users table</a>
        </li>
        <li class="nav-item">
            <a class="nav-link active" href="#">New User</a>
        </li>
    </ul>

    <!-- Form Section -->
    <div class="form-container">
        <h3 class="mb-4">Add new user</h3>

        <form th:action="@{/admin/create}" method="post" th:object="${user}">
            <div class="form-group">
                <label for="firstName">First name</label>
                <input type="text" class="form-control" id="firstName"
                       th:field="*{firstName}" required>
            </div>

            <div class="form-group">
                <label for="lastName">Last name</label>
                <input type="text" class="form-control" id="lastName"
                       th:field="*{lastName}" required>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" class="form-control" id="age"
                       th:field="*{age}" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email"
                       th:field="*{email}" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password"
                       th:field="*{password}" required>
            </div>

            <div class="form-group">
                <label>Role</label>
                <div th:each="role : ${roles}" class="form-check">
                    <input class="form-check-input" type="checkbox"
                           th:id="${role.name}" th:value="${role.id}"
                           th:field="*{roles}">
                    <label class="form-check-label" th:for="${role.name}"
                           th:text="${role.name}"></label>
                </div>
            </div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <button type="submit" class="btn btn-primary btn-block mt-4">Add new user</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
